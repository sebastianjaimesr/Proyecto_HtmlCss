<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Codificación de caracteres -->
  <meta charset="UTF-8">
  <!-- Adaptación a pantallas móviles -->
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>UberX × SpaceX — Payment Methods</title>
  <!-- Estilos globales compartidos -->
  <link rel="stylesheet" href="../css/app.css">
  <!-- Estilos específicos de la pantalla de pagos -->
  <link rel="stylesheet" href="../css/payment-methods.css">
</head>
<body class="payment-page">

<!-- Contenedor que simula la carcasa del teléfono -->
<div class="device">
<main class="payments">

  <!-- ── Encabezado de pantalla ─────────────
       Botón de volver a booking + título centrado.
  ─────────────────────────────────────────── -->
  <header class="screen-header">
    <!-- Botón de volver a la pantalla de reserva -->
    <a href="booking.html" class="btn-back" aria-label="Back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 class="screen-header__title">Payment Methods</h1>
    <!-- Espaciador para centrar el título visualmente -->
    <div class="screen-header__spacer" aria-hidden="true"></div>
  </header>

  <!-- Área con scroll: buscador + lista de tarjetas -->
  <div class="payments__scroll">

    <!-- ── Buscador de métodos de pago ────────
         Usa los estilos globales .search-wrap y .search-input
         definidos en app.css.
    ─────────────────────────────────────────── -->
    <div class="payments__search">
      <div class="search-wrap">
        <!-- Ícono de lupa posicionado con CSS dentro del input -->
        <svg class="search-wrap__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="search-input" type="search" placeholder="Search payment methods" aria-label="Search payment method">
      </div>
    </div>

    <!-- ── Lista de métodos de pago ───────────
         Cada tarjeta es un enlace que lleva al recibo.
         role="list" y role="listitem" mejoran accesibilidad.
    ─────────────────────────────────────────── -->
    <div class="list-wrap" role="list">

      <!-- ── Tarjeta 1: Tarjeta por defecto ───
           Tiene badge "Default" en dorado.
           El menú kebab (tres puntos) no navega (onclick previene).
      ─────────────────────────────────────────── -->
      <div role="listitem">
        <a href="receipt.html" class="payment-card" aria-label="Default card ending in 1234">
          <!-- Logo/ícono de la tarjeta -->
          <div class="payment-card__logo">💳</div>
          <div class="payment-card__info">
            <!-- Número enmascarado + badge de "Default" -->
            <div class="payment-card__number">
              **** **** **** 1234
              <span class="badge badge--gold">Default</span>
            </div>
            <p class="payment-card__expiry">Expires 12/25</p>
          </div>
          <!-- Menú de tres puntos (kebab): no navega al hacer clic -->
          <div class="payment-card__actions" onclick="event.preventDefault()">
            <div class="kebab" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
          </div>
        </a>
      </div>

      <!-- ── Tarjeta 2: Visa ─────────────────
           Logo "VISA" con estilos inline (fondo azul oscuro).
           Tiene botones de editar y eliminar.
      ─────────────────────────────────────────── -->
      <div role="listitem">
        <a href="receipt.html" class="payment-card" aria-label="Visa card ending in 5678">
          <!-- Logo VISA con estilos inline para el color de marca -->
          <div class="payment-card__logo" style="background:linear-gradient(135deg,#1a2a5e,#2d4a8a);font-size:.75rem;font-weight:900;color:#60a5fa;letter-spacing:-.5px;">VISA</div>
          <div class="payment-card__info">
            <div class="payment-card__number">**** **** **** 5678</div>
            <p class="payment-card__expiry">Expires 01/26</p>
          </div>
          <!-- Acciones: editar y eliminar (no navegan al hacer clic) -->
          <div class="payment-card__actions" onclick="event.preventDefault()">
            <!-- Botón de editar -->
            <div class="action-icon" aria-label="Edit">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </div>
            <!-- Botón de eliminar (se pone rojo al hacer hover) -->
            <div class="action-icon action-icon--del" aria-label="Delete">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
            </div>
          </div>
        </a>
      </div>

      <!-- ── Tarjeta 3: PayPal ───────────────
           Logo "Pay" con estilos inline (fondo azul PayPal).
           Muestra el email en lugar de número de tarjeta.
      ─────────────────────────────────────────── -->
      <div role="listitem">
        <a href="receipt.html" class="payment-card" aria-label="PayPal account">
          <!-- Logo PayPal con estilos inline -->
          <div class="payment-card__logo" style="background:#003087;font-size:.75rem;font-weight:900;color:#009cde;letter-spacing:-1px;">Pay</div>
          <div class="payment-card__info">
            <div class="payment-card__number">PayPal</div>
            <!-- Email de la cuenta en lugar de fecha de expiración -->
            <p class="payment-card__expiry">sebastian@spacex-rides.com</p>
          </div>
          <!-- Acciones: editar y eliminar -->
          <div class="payment-card__actions" onclick="event.preventDefault()">
            <div class="action-icon" aria-label="Edit">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </div>
            <div class="action-icon action-icon--del" aria-label="Delete">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
            </div>
          </div>
        </a>
      </div>

    </div><!-- /.list-wrap -->
  </div><!-- /.payments__scroll -->

  <!-- ── Botón fijo para agregar nuevo método ──
       Sticky en la parte inferior con borde punteado morado.
       El gradiente de fondo crea un efecto de desvanecimiento.
  ─────────────────────────────────────────── -->
  <div class="cta-fixed">
    <div class="btn-add">
      <!-- Ícono de "+" -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add New Method
    </div>
  </div>

</main>
</div><!-- /.device -->
</body>
</html>
