<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>UberX × SpaceX — Booking</title>
  <link rel="stylesheet" href="../css/app.css">
</head>
<body class="booking-page"><div class="device">
<main class="booking">
  <header class="screen-header">
    <a href="home.html" class="btn-back" aria-label="Volver">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 class="screen-header__title">Booking</h1>
    <div class="screen-header__spacer"></div>
  </header>

  <div class="booking__scroll">
    <div class="trip-card">
      <div class="trip-route">
        <div class="trip-planet"><div class="trip-planet__emoji">🌍</div><div class="trip-planet__name">Earth</div></div>
        <div class="trip-arrow">→</div>
        <div class="trip-planet"><div class="trip-planet__emoji" style="animation-delay:.5s">🔴</div><div class="trip-planet__name">Mars</div></div>
      </div>
      <div class="trip-grid">
        <div class="trip-stat"><div class="trip-stat__label">Ship</div><div class="trip-stat__value">Crew Dragon</div></div>
        <div class="trip-stat"><div class="trip-stat__label">Duration</div><div class="trip-stat__value">18d 13h</div></div>
        <div class="trip-stat"><div class="trip-stat__label">Launch</div><div class="trip-stat__value">12/03/53 19:30</div></div>
        <div class="trip-stat"><div class="trip-stat__label">Price</div><div class="trip-stat__value trip-stat__value--accent">48.5 ◈</div></div>
      </div>
    </div>

    <h2 class="section-title">Passenger</h2>
    <div class="passenger-card">
      <div class="pass-avatar">SJ</div>
      <div class="pass-info">
        <div class="pass-info__name">Sebastian Jaimes</div>
        <div class="pass-info__seat">Seat 24A · Economy Class</div>
      </div>
    </div>

    <h2 class="section-title">Add-ons</h2>
    <div class="extra-item"><div class="extra-item__left"><span class="extra-item__icon">🧳</span><span class="extra-item__name">Space Luggage (50kg)</span></div><span class="extra-item__price">+2.5 ◈</span></div>
    <div class="extra-item"><div class="extra-item__left"><span class="extra-item__icon">🍽️</span><span class="extra-item__name">Space Meal Package</span></div><span class="extra-item__price">+1.0 ◈</span></div>
    <div class="extra-item"><div class="extra-item__left"><span class="extra-item__icon">🛡️</span><span class="extra-item__name">Travel Insurance</span></div><span class="extra-item__price">+3.0 ◈</span></div>
  </div>

  <div class="booking__cta">
    <a href="payment-methods.html" class="btn-primary btn-primary--full">Proceed to Payment →</a>
  </div>
</main>
</div></body></html>
