<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Codificación de caracteres -->
  <meta charset="UTF-8">
  <!-- Adaptación a pantallas móviles -->
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>UberX × SpaceX — Travel</title>
  <!-- Estilos globales compartidos -->
  <link rel="stylesheet" href="../css/app.css">
  <!-- Estilos específicos de la pantalla de viaje -->
  <link rel="stylesheet" href="../css/travel.css">
</head>
<body class="travel-page">
<div class="device">

  <!-- ── Inputs ocultos para estado CSS-only ──
       Estos radio/checkbox no se ven en pantalla.
       Se usan como "interruptores" CSS: cuando el
       usuario hace clic en un label, el input cambia
       de estado y CSS aplica estilos distintos con
       selectores como #ship-1:checked ~ .travel ...
  ─────────────────────────────────────────── -->
  <!-- Radio para seleccionar la nave 1 (activa por defecto) -->
  <input type="radio" name="ship" id="ship-1" checked>
  <!-- Radio para seleccionar la nave 2 -->
  <input type="radio" name="ship" id="ship-2">
  <!-- Radio para seleccionar la nave 3 -->
  <input type="radio" name="ship" id="ship-3">
  <!-- Checkbox para expandir/colapsar el bottom sheet -->
  <input type="checkbox" id="sheet-toggle">

  <!-- Contenedor principal de la pantalla de viaje -->
  <div class="travel">

    <!-- ── Mapa espacial ──────────────────────
         Fondo oscuro con estrellas CSS, ruta animada
         entre planetas y dos imágenes de planetas.
    ─────────────────────────────────────────── -->
    <div class="space-map">

      <!-- Botón de volver a home, posicionado arriba a la izquierda -->
      <div class="space-map__back">
        <a href="home.html" class="btn-back" aria-label="Back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
      </div>

      <!-- SVG con la ruta punteada y el cohete animado -->
      <svg class="space-map__svg" viewBox="0 0 430 310" fill="none" aria-hidden="true">
        <defs>
          <!-- Gradiente de la ruta: morado (Tierra) a naranja-rojo (Marte) -->
          <linearGradient id="routeGrad" x1="80" y1="228" x2="348" y2="76" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="rgba(124,109,250,.6)"/>
            <stop offset="100%" stop-color="rgba(220,80,40,.5)"/>
          </linearGradient>
        </defs>
        <!-- Línea punteada principal de la ruta con gradiente de color -->
        <path d="M 80 228 Q 210 62 348 76"
          stroke="url(#routeGrad)" stroke-width="1.5"
          stroke-dasharray="8 7" fill="none" stroke-linecap="round"/>
        <!-- Línea punteada blanca semitransparente encima para dar brillo -->
        <path d="M 80 228 Q 210 62 348 76"
          stroke="white" stroke-width=".4" stroke-dasharray="8 7"
          fill="none" stroke-linecap="round" opacity=".25"/>
        <!-- Cohete emoji que flota en el centro de la ruta -->
        <text x="212" y="148" font-size="20" text-anchor="middle" dominant-baseline="middle"
          style="animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(124,109,250,.8))">🚀</text>
      </svg>

      <!-- Imagen de la Tierra (esquina inferior izquierda del mapa) -->
      <!-- El enlace lleva a la pantalla de reserva -->
      <a href="booking.html" aria-label="Go to Earth route">
        <img class="planet-img-earth"
          src="https://www.photolari.com/wp-content/uploads/2023/05/imagen-esa-tierra-resolucion.jpg"
          alt="Earth"/>
      </a>
      <!-- Chip de texto "Earth" con flecha, posicionado junto a la imagen -->
      <a href="booking.html" class="planet-chip planet-chip--earth" aria-label="Earth">
        Earth
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </a>

      <!-- Imagen de Marte (esquina superior derecha del mapa) -->
      <a href="booking.html" aria-label="Go to Mars route">
        <img class="planet-img-mars"
          src="https://oasisnerd.com/wp-content/uploads/2024/10/Marte.png"
          alt="Mars"/>
      </a>
      <!-- Chip de texto "Mars" con flecha -->
      <a href="booking.html" class="planet-chip planet-chip--mars" aria-label="Mars">
        Mars
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </a>

    </div><!-- /.space-map -->

    <!-- ── Bottom Sheet ────────────────────────
         Panel inferior que muestra la lista de naves.
         Al hacer clic en el handle se expande mostrando
         el detalle de la nave seleccionada (CSS-only
         usando el checkbox #sheet-toggle).
    ─────────────────────────────────────────── -->
    <div class="sheet">

      <!-- Handle: barra gris que el usuario arrastra para expandir -->
      <!-- Es un label del checkbox #sheet-toggle -->
      <label for="sheet-toggle" class="sheet__handle-wrap" aria-label="Expand details">
        <div class="sheet__handle"></div>
      </label>

      <!-- Aviso de tarifa alta por escombros espaciales -->
      <p class="sheet__warning">Fares are higher due to space debris</p>

      <!-- ── Lista de naves (vista colapsada) ──
           Se oculta cuando #sheet-toggle está marcado.
      ─────────────────────────────────────────── -->
      <div class="sheet-list">

        <!-- Nave 1: Crew Dragon (seleccionada por defecto, clase --d) -->
        <!-- Es un label del radio #ship-1 -->
        <label class="ship-label ship-label--d" for="ship-1">
          <div class="ship-label__icon">🛸</div>
          <div class="ship-label__info">
            <p class="ship-label__name">Crew Dragon</p>
            <p class="ship-label__date">Next Launch: 12/03/53 · 19:30</p>
          </div>
          <!-- Precio en criptomoneda espacial (◈) -->
          <div class="ship-label__price">48.5 <div class="price-icon">◈</div></div>
          <!-- Círculo de radio: se rellena con CSS cuando está seleccionado -->
          <div class="ship-label__radio">
            <svg class="ship-label__radio-check" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
        </label>

        <!-- Nave 2: Starliner -->
        <label class="ship-label" for="ship-2">
          <div class="ship-label__icon">🚀</div>
          <div class="ship-label__info">
            <p class="ship-label__name">Starliner</p>
            <p class="ship-label__date">Next Launch: 24/03/53 · 12:30</p>
          </div>
          <div class="ship-label__price">51.2 <div class="price-icon">◈</div></div>
          <div class="ship-label__radio">
            <svg class="ship-label__radio-check" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
        </label>

        <!-- Nave 3: Dream Chaser (la más cara) -->
        <label class="ship-label" for="ship-3">
          <div class="ship-label__icon">✈️</div>
          <div class="ship-label__info">
            <p class="ship-label__name">Dream Chaser</p>
            <p class="ship-label__date">Next Launch: 24/03/53 · 12:30</p>
          </div>
          <div class="ship-label__price">102.5 <div class="price-icon">◈</div></div>
          <div class="ship-label__radio">
            <svg class="ship-label__radio-check" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
        </label>

        <!-- ── Acciones del sheet (lista) ──────
             Botón de wallet y slider de confirmación.
        ─────────────────────────────────────────── -->
        <div class="sheet-actions">

          <!-- Botón para conectar billetera cripto -->
          <a href="payment-methods.html" class="wallet-btn">
            <div class="wallet-btn__l"><span style="font-size:1.1rem">◈</span> Connect Wallet</div>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </a>

          <!-- Slider "desliza para confirmar" -->
          <!-- El JS inline mueve el thumb y la pista según el valor del range -->
          <div class="swipe-wrap" id="sw1">
            <!-- Pista de color que crece al deslizar -->
            <div class="swipe-track" id="st1"></div>
            <!-- Pulgar circular con flecha -->
            <div class="swipe-thumb" id="sth1">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </div>
            <!-- Input range invisible encima de todo (z-index:4) -->
            <!-- oninput: mueve el thumb y la pista en tiempo real -->
            <!-- onchange: redirige a payment-methods cuando llega al 98% -->
            <input type="range" min="0" max="100" value="0" aria-label="Swipe to confirm"
              oninput="(function(el){var v=el.value,w=el.parentElement.offsetWidth,max=w-56,pos=(v/100)*max+5;document.getElementById('sth1').style.left=pos+'px';document.getElementById('st1').style.width=(pos+46)+'px';if(v>=98){document.getElementById('sth1').style.background='linear-gradient(135deg,#16a34a,#4ade80)';document.querySelector('#sw1 .swipe-label').style.opacity='0';}})(this)"
              onchange="if(this.value>=98){setTimeout(()=>{window.location='payment-methods.html'},500);}">
            <!-- Texto del slider que desaparece al deslizar -->
            <span class="swipe-label">Swipe To Confirm Booking</span>
          </div>

        </div>
      </div><!-- /.sheet-list -->

      <!-- ── Vista de detalle (sheet expandido) ──
           Se muestra cuando #sheet-toggle está marcado.
           Muestra info completa de la nave seleccionada.
      ─────────────────────────────────────────── -->
      <div class="sheet-detail">

        <!-- Emoji grande de la nave; al hacer clic colapsa el sheet -->
        <label for="sheet-toggle"><div class="detail-img">🛸</div></label>

        <!-- Información detallada del viaje -->
        <div class="detail-body">
          <div class="detail-row">
            <span class="detail-name">Crew Dragon</span>
            <div class="detail-price">48.5 <div class="price-icon">◈</div></div>
          </div>
          <p class="detail-meta">NEXT LAUNCH · 12/03/53 · 19:30</p>
          <p class="detail-meta">JOURNEY DURATION · 18 DAYS, 13 HOURS</p>
          <p class="detail-meta">ROUTE · EARTH → MARS</p>
        </div>

        <!-- Acciones repetidas en la vista de detalle -->
        <div class="sheet-actions">
          <a href="payment-methods.html" class="wallet-btn">
            <div class="wallet-btn__l"><span style="font-size:1.1rem">◈</span> Connect Wallet</div>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </a>
          <!-- Segundo slider (para la vista de detalle) -->
          <div class="swipe-wrap" id="sw2">
            <div class="swipe-track" id="st2"></div>
            <div class="swipe-thumb" id="sth2">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </div>
            <input type="range" min="0" max="100" value="0" aria-label="Swipe to confirm"
              oninput="(function(el){var v=el.value,w=el.parentElement.offsetWidth,max=w-56,pos=(v/100)*max+5;document.getElementById('sth2').style.left=pos+'px';document.getElementById('st2').style.width=(pos+46)+'px';if(v>=98){document.getElementById('sth2').style.background='linear-gradient(135deg,#16a34a,#4ade80)';}})(this)"
              onchange="if(this.value>=98){setTimeout(()=>{window.location='payment-methods.html'},500);}">
            <span class="swipe-label">Swipe To Confirm Booking</span>
          </div>
        </div>

      </div><!-- /.sheet-detail -->

    </div><!-- /.sheet -->
  </div><!-- /.travel -->
</div><!-- /.device -->
</body>
</html>
